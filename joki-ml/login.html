<script type="module">
import { supabase, ADMIN_EMAIL } from "./js/supabase-config.js";

let daftar = false;
const $ = id => document.getElementById(id);

$("switch").onclick = e => {
  e.preventDefault(); daftar = !daftar;
  $("judul").textContent = $("go").textContent = daftar ? "Daftar" : "Masuk";
  $("switch").textContent = daftar ? "Sudah punya akun? Masuk" : "Belum punya akun? Daftar";
};

async function lanjut() {
  const { data } = await supabase.auth.getSession();
  const u = data.session?.user;
  if (!u) return false;
  const next = new URLSearchParams(location.search).get("next");
  const aman = next && /^[\w-]+\.html/.test(next) ? next : "pesanan.html";
  location.href = u.email === ADMIN_EMAIL ? "admin.html" : aman;
  return true;
}

$("go").onclick = async () => {
  $("msg").textContent = "";
  const cred = { email: $("email").value.trim(), password: $("pass").value };
  const { error } = daftar
    ? await supabase.auth.signUp(cred)
    : await supabase.auth.signInWithPassword(cred);
  if (error) { $("msg").textContent = "Gagal: " + error.message; return; }
  if (!(await lanjut())) $("msg").textContent = "Cek email kamu untuk konfirmasi, lalu masuk.";
};

lanjut();
</script>
