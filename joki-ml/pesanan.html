<script type="module">
import { supabase, rp, esc } from "./js/supabase-config.js";

document.getElementById("out").onclick = async e => {
  e.preventDefault(); await supabase.auth.signOut(); location.href = "index.html";
};

const { data: s } = await supabase.auth.getSession();
const user = s.session?.user;
if (!user) location.href = "login.html";
else {
  const { data = [], error } = await supabase.from("orders").select("*")
    .eq("user_id", user.id).order("created_at", { ascending: false });
  document.getElementById("rows").innerHTML = data.length ? data.map(o => `
    <tr><td>${new Date(o.created_at).toLocaleString("id-ID")}</td>
    <td>${esc(o.item)}</td><td>${o.price ? rp(o.price) : "-"}</td>
    <td>${esc(o.bayar)}</td><td><b>${esc(o.status)}</b></td></tr>`).join("")
    : `<tr><td colspan="5">${error ? "Gagal memuat." : "Belum ada pesanan."}</td></tr>`;
}
</script>
